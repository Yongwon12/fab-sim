name: Desktop apps

# macOS and Windows installers. Built when a v* tag is pushed, or by hand:
# Actions → Desktop apps → Run workflow. A tag, or a release name given to a
# manual run (e.g. v0.2.0), also publishes them as a GitHub Release; a manual
# run without one leaves them under the run's Artifacts. Everyday checks on
# pushes and PRs live in ci.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to publish, e.g. v0.2.0 (empty = build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
            name: FAB-SIM-mac
          - os: windows-latest
            script: dist:win
            files: release/*.exe
            name: FAB-SIM-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      # The mac app is ad-hoc signed (no Apple certificate). Apple Silicon
      # refuses to run a broken signature at all, so fail the build if the
      # signature does not verify or the app does not stay up after launch.
      - name: Check the mac app signature and that it starts
        if: runner.os == 'macOS'
        run: |
          APP="release/mac-universal/FAB-SIM.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Signature|Identifier|Format"
          lipo -archs "$APP/Contents/MacOS/FAB-SIM"
          spctl -a -vv -t exec "$APP" || echo "Gatekeeper rejects it as expected without a Developer ID; users click Open Anyway once."
          "$APP/Contents/MacOS/FAB-SIM" > launch.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID"; then echo "FAB-SIM is running"; kill "$PID"; else cat launch.log; echo "FAB-SIM exited at launch"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
        run: |
          ls -la artifacts
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FAB-SIM $TAG" \
            --notes-file .github/release-notes.md
